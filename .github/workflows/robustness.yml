name: Robustness Sweep

# Every job here answers the same question from a different angle: where can
# this product be WRONG, and does it say so? The suite job proves the whole
# test tree passes; the routing jobs measure the two error directions
# separately (a false negative costs an answer, a false positive costs trust);
# the mutation job throws malformed menus, arguments and cache files at the
# router to prove a bad input degrades instead of crashing.
#
# Runs on push to main, on every tag (so a release cannot ship a regression),
# weekly on a schedule (to catch dependency drift nobody pushed), and on
# demand with an optional stress level.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"          # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      stress:
        description: "Rewording variants per fixture case (0-10)"
        default: "3"
        required: false

concurrency:
  group: robustness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ── 1. the whole tree, on the three OSes we ship binaries for ───────────
  suite:
    name: Suite (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        exclude:
          # keep the matrix honest but affordable: full version coverage on
          # Linux, only the floor and ceiling elsewhere.
          - os: macos-latest
            python: "3.10"
          - os: windows-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit + integration tests
        # test_build_binaries needs a Nuitka toolchain; the release workflow
        # owns that. Everything else must be green.
        run: pytest tests/ -q --ignore=tests/test_build_binaries.py
      - name: CLI smoke suite
        shell: bash
        run: bash tests/smoke_cli.sh "$(python -c 'import shutil,sys;print(shutil.which("neuralosd") or "")')"

  # ── 2. routing precision and recall, measured, not assumed ──────────────
  routing:
    name: Routing precision/recall
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Shared refusal-gate conformance (cross-product fixture)
        run: pytest tests/test_conformance_refusal_gate.py tests/test_refusal_gate.py -v
      - name: False-positive / false-negative sweep
        run: |
          python scripts/fp_fn_sweep.py \
            --stress "${{ github.event.inputs.stress || '3' }}" \
            --json fp_fn_report.json | tee sweep.txt
      - name: Edge-case hardening suite
        run: pytest tests/test_edge_case_hardening.py tests/test_robustness_sweep.py -v
      - name: Refuse to ship if a threshold slipped
        run: |
          grep -q "^PASS" sweep.txt || { echo "::error::routing sweep failed"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fp-fn-report
          path: |
            fp_fn_report.json
            sweep.txt
          if-no-files-found: ignore

  # ── 3. hostile inputs: a bad file must not become a bad answer ──────────
  mutation:
    name: Malformed-input sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Seed a corrupted cache, a cyclic result and a duplicate menu
        run: python scripts/malformed_input_sweep.py
      - name: Masking never regresses to a leak
        run: pytest tests/test_masking.py tests/test_edge_case_hardening.py -v
      - name: Encoding hygiene (no locale-default text IO)
        run: pytest tests/test_module_hygiene.py -v

  # ── 4. does the gate still refuse what it must, on a live instance? ─────
  refusal-discipline:
    name: Refusal discipline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Build a scratch instance and interrogate it
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          printf 'a,b\n1,2\n3,4\n' > "$WORK/rows.csv"
          neuralosd init --source "$WORK/rows.csv" --name sweep --out "$WORK/inst"
          # A generated menu is opt-in vocabulary, so it is held to a lower
          # routing bar than the curated fixture (0.8 vs 0.95): its one-word
          # triggers ("by region") can be claimed by two honest probes, and the
          # sweep reports those as menu collisions rather than router misses.
          # What must be absolute is what comes next: a question no probe owns
          # has to REFUSE.
          python scripts/fp_fn_sweep.py --instance "$WORK/inst" --min-recall 0.8
          # the hard contract: an out-of-domain question must refuse, not guess
          set +e
          neuralosd ask --instance-dir "$WORK/inst" "how many worklog entries exist"
          code=$?
          set -e
          echo "exit=$code"
          test "$code" -eq 2 || { echo "::error::out-of-domain question did not refuse (exit $code)"; exit 1; }
