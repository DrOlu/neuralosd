name: Build & Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" && pytest tests/ -v
      - run: pip install -e . && bash tests/smoke_cli.sh "$(which neuralosd)"

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Publish to PyPI
        # Trusted publishing (OIDC) fails with `invalid-publisher` — the
        # project's Trusted Publisher mapping on PyPI does not match this
        # workflow. Use the same API-token path auto-update.yml uses.
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine upload dist/* --username __token__ --password "$PYPI_API_TOKEN" \
            --non-interactive --skip-existing
