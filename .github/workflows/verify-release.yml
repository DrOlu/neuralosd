name: Verify Release (published binaries)

# Post-release gate: downloads the binaries from the PUBLISHED GitHub release
# (not a fresh build) and proves the two multi-instance bugs that shipped in
# v2.9.4 — the startup NameError and the silently-ignored --auth-token — are
# dead in the artefacts users actually download. The windows-latest job is
# the one that matters: that is the platform where v2.9.4 crashed on startup
# and served unauthenticated.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify, e.g. v2.9.5"
        required: true
      targets:
        description: "Comma list to verify (blank = all): windows-x64-base, windows-x64-msb, macos-arm64-base, linux-x64-base"
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { name: windows-x64-base, os: windows-latest, asset: neuralosd-windows-x64.exe }
          - { name: windows-x64-msb,  os: windows-latest, asset: neuralosd-msb-windows-x64.exe }
          - { name: macos-arm64-base, os: macos-latest,   asset: neuralosd-macos-arm64 }
          - { name: linux-x64-base,   os: ubuntu-latest,  asset: neuralosd-linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download published binary
        shell: bash
        run: |
          TAG='${{ github.event.inputs.tag }}'
          ASSET='${{ matrix.asset }}'
          WANTED='${{ github.event.inputs.targets }}'
          if [ -n "$WANTED" ]; then
            case ",$WANTED," in
              *",${{ matrix.name }},"*) ;;
              *) echo "skipped by targets filter"; exit 0 ;;
            esac
          fi
          echo "downloading $ASSET from release $TAG"
          # retry + resume: release-asset 504s from runners are common and
          # always transient (asset itself verified healthy)
          curl -fSL --retry 6 --retry-all-errors --retry-delay 15 \
            --connect-timeout 30 -C - -o "$ASSET" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/$ASSET"
          chmod +x "$ASSET" 2>/dev/null || true
          ls -lh "$ASSET"

      - name: CLI smoke (published binary)
        shell: bash
        run: |
          WANTED='${{ github.event.inputs.targets }}'
          case ",$WANTED," in
            *",${{ matrix.name }},"*|",",) bash tests/smoke_cli.sh "$(pwd)/${{ matrix.asset }}" ;;
            *) echo "skipped by targets filter" ;;
          esac

      - name: Multi-instance crash regression (published binary)
        shell: bash
        run: |
          WANTED='${{ github.event.inputs.targets }}'
          case ",$WANTED," in
            *",${{ matrix.name }},"*|",",) ;;
            *) echo "skipped by targets filter"; exit 0 ;;
          esac
          set -u
          NS="$(pwd)/${{ matrix.asset }}"
          SCRATCH="$(mktemp -d)"
          trap 'kill $SRV 2>/dev/null || true; taskkill //F //IM "${{ matrix.asset }}" >/dev/null 2>&1 || true; rm -rf "$SCRATCH"' EXIT
          mkdir -p "$SCRATCH/inv" "$SCRATCH/ops"
          for d in inv ops; do
            cat > "$SCRATCH/$d/probes.py" <<'EOF'
          from neuralosd import probe

          @probe(description="Health", triggers=["health"], name="health_probe")
          def health_probe():
              return {"ok": True}

          PROBES = [health_probe]
          EOF
          done

          fail() { echo "FAIL: $1"; exit 1; }
          code() { curl -s -o /dev/null -w '%{http_code}' "$@" || true; }

          # 1) missing instances dir must fail CLEANLY — v2.9.4 crashed here
          #    with NameError: name 'os' is not defined
          OUT=$("$NS" serve --instances-dir "$SCRATCH/nope" 2>&1 || true)
          echo "$OUT" | grep -q "NameError" && fail "NameError on missing dir: $OUT"
          echo "$OUT" | grep -q "not found" || fail "expected clean not-found error, got: $OUT"
          echo "  OK clean missing-dir error (no NameError)"

          # 2) real serve on the published binary: crash-free startup
          PORT=18987
          cd "$SCRATCH"
          "$NS" serve --instances-dir "$SCRATCH" --port $PORT --auth-token tok123 \
            > serve.log 2>&1 &
          SRV=$!
          ok=""
          for i in $(seq 1 60); do
            [ "$(code "http://127.0.0.1:$PORT/healthz")" = "200" ] && { ok=1; break; }
            sleep 1
          done
          [ "$ok" ] || { echo "--- serve.log ---"; cat serve.log; fail "published binary never served /healthz"; }
          echo "  OK published binary serves multi-instance /healthz"

          # 3) --auth-token must NOT be silently ignored (v2.9.4 Bug 2)
          grep -q "token auth ON" serve.log || { cat serve.log; fail "no [token auth ON] in serve log"; }
          [ "$(code -X POST -d '{"question":"health"}' "http://127.0.0.1:$PORT/inv/ask")" = "401" ] \
            || fail "POST /inv/ask without credentials did not 401"
          [ "$(code "http://127.0.0.1:$PORT/instances")" = "401" ] \
            || fail "GET /instances without credentials did not 401"
          echo "  OK locked: /instances and /{name}/ask 401 without credentials"

          # 4) correct credentials unlock; instance routing works
          R=$(curl -s -X POST -H 'Authorization: Bearer tok123' \
                   -d '{"question":"health"}' "http://127.0.0.1:$PORT/inv/ask")
          echo "$R" | grep -q "health_probe" || fail "authed ask failed: $R"
          R=$(curl -s -H 'Authorization: Bearer tok123' "http://127.0.0.1:$PORT/instances")
          echo "$R" | grep -q "inv" && echo "$R" | grep -q "ops" \
            || fail "authed /instances wrong: $R"
          R=$(curl -s -X POST -H 'X-API-Token: tok123' \
                   -d '{"question":"health"}' "http://127.0.0.1:$PORT/ops/ask")
          echo "$R" | grep -q "health_probe" || fail "X-API-Token ask failed: $R"
          echo "  OK authed Bearer + X-API-Token reach both instances"
          echo "PUBLISHED BINARY VERIFIED (${{ matrix.name }})"

  # E7 regression gate: the routing gate (calibrated floor in router.json)
  # must behave IDENTICALLY in the wheel and the published binary, from any
  # launch directory. v2.9.10 read router.json from the process CWD only, so
  # the same build answered differently depending on where it was launched —
  # reported as "binary vs wheel disagree". This job builds one fixture
  # instance, calibrates a floor above the question's natural score, asks
  # the same question of both builds from the PARENT directory, and asserts
  # parity + a published below_floor decision path from each.
  differential:
    name: Gate differential (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64-base, os: windows-latest, asset: neuralosd-windows-x64.exe }
          - { name: macos-arm64-base, os: macos-latest,   asset: neuralosd-macos-arm64 }
          - { name: linux-x64-base,   os: ubuntu-latest,  asset: neuralosd-linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download published binary
        shell: bash
        run: |
          TAG='${{ github.event.inputs.tag }}'
          ASSET='${{ matrix.asset }}'
          echo "downloading $ASSET from release $TAG"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 15 \
            --connect-timeout 30 -C - -o "$ASSET" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/$ASSET"
          chmod +x "$ASSET" 2>/dev/null || true
          ls -lh "$ASSET"

      - name: Install matching wheel
        shell: bash
        run: |
          TAG='${{ github.event.inputs.tag }}'
          python -m pip install --upgrade pip
          python -m pip install "neuralosd==${TAG#v}"
          python -c "import neuralosd; print('wheel', neuralosd.__version__)"

      - name: Differential gate check (wheel vs published binary)
        shell: bash
        run: python scripts/differential_gate_check.py "$(pwd)/${{ matrix.asset }}"
