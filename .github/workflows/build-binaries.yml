name: Build Binaries (Nuitka)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Only build this target (blank = all): macos-arm64, macos-x64, linux-x64, linux-arm64, windows-x64"
        default: ""

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          ALL='[
            {"os":"macos-latest","target":"macos-arm64"},
            {"os":"macos-13","target":"macos-x64"},
            {"os":"ubuntu-latest","target":"linux-x64"},
            {"os":"ubuntu-24.04-arm","target":"linux-arm64"},
            {"os":"windows-latest","target":"windows-x64"}
          ]'
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then
            MATRIX=$(python3 -c "
import json,sys
allm=json.loads('''$ALL''')
only='$ONLY'
sel=[m for m in allm if m['target']==only]
if not sel:
    print('unknown target: '+only, file=sys.stderr); sys.exit(1)
print(json.dumps({'include':sel}))
")
          else
            MATRIX=$(python3 -c "import json; print(json.dumps({'include':json.loads('''$ALL''')}))")
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "building: $MATRIX"

  build:
    name: Build (${{ matrix.target }})
    needs: setup
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install neuralos pydantic pymysql nuitka
          pip install -e .

      - name: Build with Nuitka
        shell: bash
        run: |
          python -m nuitka \
            --onefile \
            --output-dir=dist \
            --output-filename=neuralosd \
            --include-package=neuralosd \
            --include-package=neuralosd._cmd \
            --include-package=needle \
            --include-package=pydantic \
            --include-package-data=needle \
            --include-package-data=neuralosd \
            --nofollow-import-to=*.tests \
            --nofollow-import-to=*.torch \
            --nofollow-import-to=*.matplotlib \
            --nofollow-import-to=*.tkinter \
            --assume-yes-for-downloads \
            entry_point.py

      - name: Rename binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/neuralosd.exe "dist/neuralosd-${{ matrix.target }}.exe" 2>/dev/null || true
          else
            mv dist/neuralosd "dist/neuralosd-${{ matrix.target }}" 2>/dev/null || \
            mv dist/neuralosd.bin "dist/neuralosd-${{ matrix.target }}" 2>/dev/null || true
          fi
          ls -lh dist/neuralosd-* || true

      - name: Smoke test binary
        shell: bash
        run: |
          BINARY=$(find dist -maxdepth 1 -type f -name "neuralosd-*" | head -1)
          if [ -z "$BINARY" ]; then echo "no binary found"; ls -la dist; exit 1; fi
          chmod +x "$BINARY" 2>/dev/null || true
          echo "binary: $BINARY ($(du -h "$BINARY" | cut -f1))"
          bash tests/smoke_cli.sh "$(pwd)/$BINARY"

      - uses: actions/upload-artifact@v4
        with:
          name: neuralosd-${{ matrix.target }}
          path: dist/neuralosd-*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: List binaries
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/neuralosd-*
          generate_release_notes: true