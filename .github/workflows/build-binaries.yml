name: Build Binaries (Nuitka)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Only build this target (blank = all): macos-arm64, macos-x64, linux-x64, linux-arm64, windows-x64"
        default: ""
      variants:
        description: "Variants to build (comma list): base,boxlite,msb"
        default: "base,boxlite,msb"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      variants: ${{ steps.set.outputs.variants }}
    steps:
      - id: set
        run: |
          ALL='[{"os":"macos-latest","target":"macos-arm64"},{"os":"macos-15-intel","target":"macos-x64"},{"os":"ubuntu-latest","target":"linux-x64"},{"os":"ubuntu-24.04-arm","target":"linux-arm64"},{"os":"windows-latest","target":"windows-x64"}]'
          ONLY='${{ github.event.inputs.only }}'
          if [ -z "$ONLY" ]; then
            MATRIX="{\"include\":$ALL}"
          else
            MATRIX=$(python3 -c "import json,sys; a=json.loads(sys.argv[1]); s=[m for m in a if m['target']==sys.argv[2]]; sys.exit('unknown target: '+sys.argv[2]) if not s else print(json.dumps({'include':s}))" "$ALL" "$ONLY")
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          V='${{ github.event.inputs.variants }}'
          [ -z "$V" ] && V="base,boxlite,msb"
          echo "variants=$V" >> "$GITHUB_OUTPUT"
          echo "targets: $MATRIX"
          echo "variants: $V"

  build:
    name: Build (${{ matrix.target }})
    needs: setup
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Wait for the release to appear on PyPI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "waiting for neuralosd==$VERSION on PyPI ..."
          for i in $(seq 1 40); do
            if curl -sf "https://pypi.org/pypi/neuralosd/json" | grep -q "\"version\": \"$VERSION\""; then
              echo "  visible on PyPI after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "::error::neuralosd==$VERSION never appeared on PyPI (publish workflow lag or failure)"
          exit 1

      - name: Install base dependencies
        run: |
          pip install neuralos pydantic pymysql nuitka pytest openpyxl
          pip install -e .

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Build base binary
        if: contains(needs.setup.outputs.variants, 'base')
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          bash scripts/build_binary.sh base neuralosd "$VERSION"

      - name: Install BoxLite
        if: contains(needs.setup.outputs.variants, 'boxlite')
        continue-on-error: true
        run: pip install "boxlite>=0.10.0"

      - name: Build boxlite binary
        if: contains(needs.setup.outputs.variants, 'boxlite')
        continue-on-error: true
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          bash scripts/build_binary.sh boxlite neuralosd-boxlite "$VERSION" || echo "BOX_BUILD_SKIPPED=true" >> "$GITHUB_ENV"

      - name: Install Microsandbox
        if: contains(needs.setup.outputs.variants, 'msb')
        continue-on-error: true
        run: pip install "microsandbox>=0.7.0"

      - name: Build msb binary
        if: contains(needs.setup.outputs.variants, 'msb')
        continue-on-error: true
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          bash scripts/build_binary.sh msb neuralosd-msb "$VERSION" || echo "MSB_BUILD_SKIPPED=true" >> "$GITHUB_ENV"

      - name: List built binaries
        shell: bash
        run: ls -lh dist/ || true

      - name: Smoke test every built binary
        shell: bash
        run: |
          shopt -s nullglob
          bins=(dist/neuralosd dist/neuralosd-boxlite dist/neuralosd-msb)
          [ -x dist/neuralosd.exe ] && bins+=(dist/neuralosd.exe)
          [ -x dist/neuralosd-boxlite.exe ] && bins+=(dist/neuralosd-boxlite.exe)
          [ -x dist/neuralosd-msb.exe ] && bins+=(dist/neuralosd-msb.exe)
          found=0
          for b in "${bins[@]}"; do
            if [ -f "$b" ]; then
              found=1
              echo "===== smoke: $b ====="
              chmod +x "$b" 2>/dev/null || true
              bash tests/smoke_cli.sh "$(pwd)/$b" || { echo "SMOKE FAILED: $b"; exit 1; }
            fi
          done
          [ "$found" = "1" ] || { echo "no binaries built"; exit 1; }

      - name: Verify each variant carries exactly its backend
        shell: bash
        run: |
          # The build env has boxlite/microsandbox installed (to build the
          # variants). The msb backend also honours a PATH `msb`, so the BASE
          # binary would legitimately find the host one. Uninstall them first
          # so each binary is judged on what it actually carries.
          pip uninstall -y boxlite microsandbox >/dev/null 2>&1 || true
          hash -r 2>/dev/null || true
          echo "host msb after uninstall: $(command -v msb || echo none)"
          # Every built variant must report exactly the right availability:
          #   base    -> neither
          #   boxlite -> boxlite only
          #   msb     -> msb only
          verify() { # binary, want_boxlite(0/1), want_msb(0/1)
            local bin="$1" wantb="$2" wantm="$3"
            [ -f "$bin" ] || { echo "  (skip $bin — not built)"; return 0; }
            local out; out=$("$bin" backends 2>&1 || true)
            echo "$out" | sed 's/^/      /'
            local gotb=0 gotm=0
            echo "$out" | grep -q "boxlite.*available" && gotb=1
            echo "$out" | grep -q "msb.*available" && gotm=1
            if [ "$gotb" = "$wantb" ] && [ "$gotm" = "$wantm" ]; then
              echo "  ✓ $bin correct (boxlite=$gotb msb=$gotm)"
            else
              echo "  ✗ $bin WRONG: want boxlite=$wantb msb=$wantm, got boxlite=$gotb msb=$gotm"
              exit 1
            fi
          }
          verify dist/neuralosd         0 0
          verify dist/neuralosd-boxlite 1 0
          verify dist/neuralosd-msb     0 1

      - name: Diagnose msb bundle layout
        if: always()
        shell: bash
        run: |
          BIN=$(find dist -maxdepth 1 -type f -name "neuralosd-msb*" 2>/dev/null | head -1 || true)
          [ -n "$BIN" ] || { echo "no msb binary"; exit 0; }
          chmod +x "$BIN" 2>/dev/null || true
          mkdir -p diaginst
          cp tests/diagnose_msb_probes.py diaginst/probes.py
          echo "----- msb bundle diagnostic -----"
          "$(pwd)/$BIN" ask --instance-dir diaginst "diag" 2>&1 | head -60 || true
          echo "---------------------------------"

      - name: Sidecar — run a probe on a host library the binary lacks
        shell: bash
        run: |
          BIN=$(find dist -maxdepth 1 -type f -name "neuralosd" 2>/dev/null | head -1 || true)
          if [ -z "$BIN" ]; then echo "(no base binary built — skipping)"; exit 0; fi
          chmod +x "$BIN" 2>/dev/null || true
          pip install pypdf >/dev/null
          mkdir -p sideinst
          cp tests/sidecar_e2e_probes.py sideinst/probes.py

          echo "===== A) sidecar DISABLED: must fail clearly, not crash ====="
          set +e
          outA=$(NEURALOSD_SIDECAR=off "$(pwd)/$BIN" ask --instance-dir sideinst "pdf pages" 2>&1)
          codeA=$?
          set -e
          echo "$outA" | head -8
          [ "$codeA" -ne 0 ] || { echo "FAIL(A): expected a non-zero exit without a sidecar"; exit 1; }
          echo "$outA" | grep -q "pypdf" || { echo "FAIL(A): error did not name pypdf"; exit 1; }
          echo "$outA" | grep -qi "pip install" || { echo "FAIL(A): error was not actionable"; exit 1; }
          echo "  PASS A: clean failure that names pypdf and suggests installing it"

          echo "===== B) sidecar ENABLED: must answer via the host Python ====="
          set +e
          outB=$("$(pwd)/$BIN" ask --instance-dir sideinst "pdf pages" 2>&1)
          codeB=$?
          set -e
          echo "$outB" | head -20
          [ "$codeB" -eq 0 ] || { echo "FAIL(B): sidecar run exited $codeB"; exit 1; }
          echo "$outB" | grep -q '"pages": 2' || { echo "FAIL(B): wrong or missing result"; exit 1; }
          echo "  PASS B: frozen binary answered using a library it does not contain"

      - name: Sidecar — uv-provisioned environment (real uv)
        shell: bash
        run: |
          BIN=$(find dist -maxdepth 1 -type f -name "neuralosd" 2>/dev/null | head -1 || true)
          if [ -z "$BIN" ]; then echo "(no base binary — skipping)"; exit 0; fi
          chmod +x "$BIN" 2>/dev/null || true

          export NEURALOSD_HOME="$RUNNER_TEMP/neuralosd-home"
          rm -rf "$NEURALOSD_HOME"

          echo "===== provision a sidecar with real uv ====="
          python -m neuralosd.provision --setup --with pypdf
          test -f "$NEURALOSD_HOME/sidecar/bin/neuralosd-sidecar"             || test -f "$NEURALOSD_HOME/sidecar/Scripts/neuralosd-sidecar.exe"             || { echo "FAIL: provisioned executable missing"; exit 1; }

          echo "===== remove every other copy so discovery must use the provisioned one ====="
          pip uninstall -y neuralosd >/dev/null 2>&1 || true
          hash -r 2>/dev/null || true
          echo "  neuralosd-sidecar on PATH now: $(command -v neuralosd-sidecar || echo none)"

          echo "===== the binary must find it with no NEURALOSD_SIDECAR set ====="
          mkdir -p uvinst
          cp tests/sidecar_e2e_probes.py uvinst/probes.py
          set +e
          out=$(env -u NEURALOSD_SIDECAR -u NEURALOSD_UV "$(pwd)/$BIN" \
                ask --instance-dir uvinst "pdf pages" 2>&1)
          code=$?
          set -e
          echo "$out" | head -20
          [ "$code" -eq 0 ] || { echo "FAIL: binary exited $code"; exit 1; }
          echo "$out" | grep -q '"pages": 2' || { echo "FAIL: provisioned sidecar not used"; exit 1; }
          echo "  PASS: binary used the uv-provisioned sidecar with zero configuration"

      - name: Rename with target suffix
        shell: bash
        run: |
          for b in dist/neuralosd dist/neuralosd-boxlite dist/neuralosd-msb; do
            if [ -f "$b" ]; then mv "$b" "$b-${{ matrix.target }}"; fi
            if [ -f "$b.exe" ]; then mv "$b.exe" "$b-${{ matrix.target }}.exe"; fi
          done
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: neuralosd-${{ matrix.target }}
          path: dist/neuralosd-*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: List binaries
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/neuralosd-*
          generate_release_notes: true
