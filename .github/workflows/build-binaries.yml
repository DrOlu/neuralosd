name: Build Binaries (Nuitka)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: macos-13
            target: macos-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install neuralos pydantic pymysql nuitka
          pip install -e .

      - name: Build with Nuitka
        shell: bash
        run: |
          python -m nuitka \
            --onefile \
            --output-dir=dist \
            --output-filename=neuralosd \
            --include-package=neuralosd \
            --include-package=needle \
            --include-package=pydantic \
            --include-package-data=needle \
            --include-package-data=neuralosd \
            --nofollow-import-to=*.tests \
            --nofollow-import-to=*.torch \
            --nofollow-import-to=*.matplotlib \
            --nofollow-import-to=*.tkinter \
            --assume-yes-for-downloads \
            entry_point.py

      - name: Rename binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/entry_point.exe dist/neuralosd-${{ matrix.target }}.exe 2>/dev/null || true
          else
            mv dist/entry_point dist/neuralosd-${{ matrix.target }} 2>/dev/null || \
            mv dist/entry_point.bin dist/neuralosd-${{ matrix.target }} 2>/dev/null || true
          fi
          ls -lh dist/neuralosd* || true

      - name: Smoke test
        shell: bash
        run: |
          BINARY=$(find dist -name "neuralosd*" -type f | head -1)
          if [ -n "$BINARY" ]; then
            echo "binary: $BINARY ($(du -h "$BINARY" | cut -f1))"
          else
            echo "no binary found"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: neuralosd-${{ matrix.target }}
          path: dist/neuralosd*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: List binaries
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/neuralosd*
          generate_release_notes: true
