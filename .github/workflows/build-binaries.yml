name: Build & Publish Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Also publish to PyPI"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # Apple Silicon
            target: macos-arm64
          - os: macos-13              # Intel Mac
            target: macos-x64
          - os: ubuntu-latest         # Linux x86_64
            target: linux-x64
          - os: ubuntu-24.04-arm      # Linux ARM64
            target: linux-arm64
          - os: windows-latest        # Windows x64
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install neuralos pydantic pyinstaller pymysql boxlite
        continue-on-error: true    # boxlite may fail on some platforms

      - name: Build binary
        shell: bash
        run: |
          pyinstaller --onefile --name neuralosd \
            --paths src \
            --hidden-import neuralosd \
            --hidden-import neuralosd.probe \
            --hidden-import neuralosd.router \
            --hidden-import neuralosd.instance \
            --hidden-import neuralosd.chains \
            --hidden-import neuralosd.meta \
            --hidden-import neuralosd.hitl \
            --hidden-import neuralosd.lint \
            --hidden-import neuralosd.cli \
            --hidden-import neuralosd.engine \
            --hidden-import neuralosd.registry \
            --hidden-import neuralosd.memory \
            --hidden-import neuralosd.scheduler \
            --hidden-import neuralosd.metrics \
            --hidden-import neuralosd.adapters \
            --hidden-import neuralosd.backends \
            --hidden-import neuralosd.backends.boxlite_backend \
            --hidden-import neuralosd.backends.msb_backend \
            --hidden-import needle \
            --hidden-import pydantic \
            --hidden-import pydantic.deprecated \
            --collect-all needle \
            --collect-all neuralosd \
            --collect-submodules pydantic \
            entry_point.py

      - name: Smoke test binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/neuralosd.exe --help || true
          else
            chmod +x dist/neuralosd
            ./dist/neuralosd --help || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuralosd-${{ matrix.target }}
          path: dist/neuralosd*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: List binaries
        run: ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/neuralosd*
          generate_release_notes: true
          draft: false
